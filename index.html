<!DOCTYPE html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nuoto Libero – Corsie disponibili</title><style>
:root{--bg1:#04162b;--bg2:#0a3a5c;--card:rgba(255,255,255,.07);--bd:rgba(255,255,255,.14);--tx:#e8f4ff;--mu:#93b4cc;

.btn-p:disabled{opacity:.5;cursor:not-allowed}
.modal{max-height:92vh;overflow-y:auto}

"e":"16:00","n":0,"note":"Nuoto libero chiuso"},{"s":"16:00","e":"16:50","n":2,"note":""},{"s":"16:50","e":"17:15","n":1,"note":""},{"s":"17:15","e":"18:00","n":3,"note":""},{"s":"18:00","e":"19:10","n":2,"note":""},{"s":"19:10","e":"21:30","n":2,"note":""}],"vasca":[{"s":"09:00","e":"17:20"}]},{"name":"Sabato","slots":[{"s":"09:00","e":"11:30","n":4,"note":""},{"s":"11:30","e":"12:10","n":5,"note":""},{"s":"12:10","e":"13:10","n":3,"note":""},{"s":"13:10","e":"17:15","n":2,"note":""},{"s":"17:15","e":"18:30","n":4,"note":""}],"vasca":[{"s":"09:00","e":"10:00"},{"s":"12:00","e":"17:15"}]},{"name":"Domenica","slots":[],"vasca":[{"s":"09:00","e":"12:30"}]}]}</script><script>(function viewerMain(){
 // ====== IMPOSTAZIONI (si possono cambiare a mano nel file index.html) ======
 const GOOGLE_SHEETS_URL = "https://script.google.com/macros/s/AKfycbwv765VbCY-1HYXyH4jtpETqCFkx6BBvaLWyLFTuLGWPD6xtPdNxaeyl7r1cmCYyFm9Ag/exec";
 const PERSONE_PER_CORSIA = 6;               // quante persone stanno in una corsia
 const PROSSIMA_SETTIMANA_DAL_GIORNO = 5;    // da che giorno si apre la prossima settimana: 0=Lunedì ... 5=Sabato, 6=Domenica
 const PASSO = 30;                           // l'orario si sceglie a multipli di 30 minuti
 const DURATA_MIN = 30;                      // durata minima di una prenotazione (minuti)
 // ============================================================================

 const D = JSON.parse(document.getElementById('dati').textContent);
 let BOOK = [], sel = null, wk = 0, active = null;

 const $ = s => document.querySelector(s);
 const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
 const pad = n => String(n).padStart(2, '0');
 const tm = t => { const [a, b] = (t || '0:0').split(':'); return (+a) * 60 + (+b) };
 const fm = m => Math.floor(m / 60) + ':' + pad(m % 60);
 const hhmm = m => pad(Math.floor(m / 60)) + ':' + pad(m % 60);
 const fmt = t => fm(tm(t));
 const cls = n => n <= 0 ? 'c-x' : n >= 5 ? 'c-g' : n >= 3 ? 'c-y' : 'c-r';
 const lab = n => n <= 0 ? 'Chiuso' : n + (n == 1 ? ' corsia' : ' corsie');
 const laneBar = n => { let h = ''; for (let i = 0; i < D.totCorsie; i++) h += '<span class="' + (i < n ? 'f' : '') + '"></span>'; return '<div class="ln">' + h + '</div>' };
 const todayIdx = () => (new Date().getDay() + 6) % 7;
 const nowMin = () => { const d = new Date(); return d.getHours() * 60 + d.getMinutes() };
 const ymd = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
 const dateOf = (w, di) => { const d = new Date(); d.setHours(12, 0, 0, 0); d.setDate(d.getDate() - todayIdx() + 7 * w + di); return d };
 const MESI = ['gennaio', 'febbraio', 'marzo', 'aprile', 'maggio', 'giugno', 'luglio', 'agosto', 'settembre', 'ottobre', 'novembre', 'dicembre'];
 const MS = ['gen', 'feb', 'mar', 'apr', 'mag', 'giu', 'lug', 'ago', 'set', 'ott', 'nov', 'dic'];
 const weekRange = w => { const a = dateOf(w, 0), b = dateOf(w, 6); return a.getMonth() === b.getMonth() ? a.getDate() + '–' + b.getDate() + ' ' + MS[b.getMonth()] : a.getDate() + ' ' + MS[a.getMonth()] + ' – ' + b.getDate() + ' ' + MS[b.getMonth()] };
 const slotAt = (di, m) => D.days[di].slots.find(s => tm(s.s) <= m && m < tm(s.e));
 const toast = m => { const t = $('#toast'); t.textContent = m; t.classList.add('s'); setTimeout(() => t.classList.remove('s'), 2800); };

 // ---------- occupazione ----------
 const cap = n => n * PERSONE_PER_CORSIA;
 const freeLanes = (n, c) => Math.max(0, n - Math.floor(c / PERSONE_PER_CORSIA));
 const freeMin = (segs, a, b, cp) => cp - Math.max(0, ...segs.filter(x => x.s < b && x.e > a).map(x => x.c));

 function intervals(date) {
  const r = [];
  BOOK.forEach(b => {
   if (String(b.data || '').slice(0, 10) !== date) return;
   const s = tm(b.oraInizio), e = tm(b.oraFine);
   if (e > s) r.push({ s, e });
  });
  return r;
 }
 // tratti della fascia con il numero di persone presenti in ogni tratto
 function segments(w, di, slot) {
  const a = tm(slot.s), z = tm(slot.e);
  const bs = intervals(ymd(dateOf(w, di))).filter(b => b.s < z && b.e > a);
  const pts = [...new Set([a, z, ...bs.flatMap(b => [Math.max(a, b.s), Math.min(z, b.e)])])].sort((x, y) => x - y);
  const out = [];
  for (let i = 0; i < pts.length - 1; i++) {
   const x = pts[i], y = pts[i + 1];
   out.push({ s: x, e: y, c: bs.filter(b => b.s < y && b.e > x).length });
  }
  return out;
 }
 const slotLanes = (w, di, s) => { const sg = segments(w, di, s); return sg.length ? Math.min(...sg.map(x => freeLanes(s.n, x.c))) : s.n; };

 // ---------- orari scelti da chi prenota ----------
 function grid(s) {
  const a = tm(s.s), z = tm(s.e), p = [a];
  for (let t = Math.ceil((a + 1) / PASSO) * PASSO; t < z; t += PASSO) p.push(t);
  p.push(z);
  return p;
 }
 const dMin = s => Math.min(DURATA_MIN, tm(s.e) - tm(s.s));
 function startOpts(w, di, s) {
  const ti = todayIdx(), nm = nowMin(), z = tm(s.e), dm = dMin(s);
  return grid(s).slice(0, -1).filter(t => t + dm <= z && (!(w === 0 && di === ti) || t >= nm));
 }
 const defEnd = (g, a) => g.find(t => t >= a + 60) || g[g.length - 1];
 function anyFree(w, di, s, opts) {
  const g = grid(s), dm = dMin(s), segs = segments(w, di, s), cp = cap(s.n);
  return opts.some(a => g.some(b => b >= a + dm && freeMin(segs, a, b, cp) > 0));
 }
 function slotState(w, di, s) {
  if (s.n <= 0) return { ok: false, label: 'Chiuso' };
  if (w === 0 && di < todayIdx()) return { ok: false, label: 'Passato', dim: true };
  const opts = startOpts(w, di, s);
  if (!opts.length) return { ok: false, label: 'Passato', dim: true };
  if (!anyFree(w, di, s, opts)) return { ok: false, label: 'Completo' };
  return { ok: true, label: 'Prenota' };
 }
 function chipsHtml(s, segs) {
  const m = [];
  segs.forEach(x => {
   const l = freeLanes(s.n, x.c), last = m[m.length - 1];
   if (last && last.l === l) last.e = x.e; else m.push({ s: x.s, e: x.e, l });
  });
  if (m.every(x => x.l === s.n)) return '';
  return '<div class="segs">' + m.map(x => `<span class="seg ${cls(x.l)}">${fm(x.s)}–${fm(x.e)} · ${x.l > 0 ? lab(x.l) : 'completo'}</span>`).join('') + '</div>';
 }

 // ---------- dati dal foglio Google ----------
 async function fetchBookings() {
  if (!GOOGLE_SHEETS_URL) return;
  try {
   const res = await fetch(GOOGLE_SHEETS_URL + '?v=' + Date.now());
   if (!res.ok) return;
   const json = await res.json();
   if (json && Array.isArray(json.prenotazioni)) BOOK = json.prenotazioni;
  } catch (e) { console.warn('Prenotazioni non lette', e); }
 }

 window.pick = i => { sel = i; render(); };
 window.setWeek = w => { wk = w; sel = w === 0 ? todayIdx() : 0; render(); };

 // ---------- finestra di prenotazione ----------
 const mDa = $('#mDa'), mA = $('#mA'), mInfo = $('#mInfo'), mBtn = $('#mSubmitBtn');
 const optsHtml = (arr, s) => arr.map(t => `<option value="${t}"${t === s ? ' selected' : ''}>${fm(t)}</option>`).join('');

 function fillEnd(pref) {
  const a = +mDa.value, ends = active.g.filter(t => t >= a + active.dm);
  const keep = ends.includes(pref) ? pref : (ends.find(t => t >= a + 60) || ends[ends.length - 1]);
  mA.innerHTML = optsHtml(ends, keep);
 }
 function peakOf(a, b) {
  const segs = segments(active.w, active.di, active.slot).filter(x => x.s < b && x.e > a);
  return { segs, peak: Math.max(0, ...segs.map(x => x.c)) };
 }
 function upd() {
  if (!active) return;
  const a = +mDa.value, b = +mA.value, cp = cap(active.slot.n);
  const { segs, peak } = peakOf(a, b), free = cp - peak;
  if (free > 0) {
   mInfo.className = 'minfo';
   mInfo.textContent = `✅ ${fm(a)} – ${fm(b)} · ${free} ${free == 1 ? 'posto libero' : 'posti liberi'}`;
   mBtn.disabled = false;
  } else {
   const full = [];
   segs.filter(x => x.c >= cp).forEach(x => {
    const s = Math.max(x.s, a), e = Math.min(x.e, b), l = full[full.length - 1];
    if (l && l.e === s) l.e = e; else full.push({ s, e });
   });
   mInfo.className = 'minfo bad';
   mInfo.textContent = '⛔ Completo ' + full.map(x => fm(x.s) + '–' + fm(x.e)).join(', ') + '. Scegli un altro orario.';
   mBtn.disabled = true;
  }
 }
 mDa.onchange = () => { fillEnd(+mA.value); upd(); };
 mA.onchange = upd;

 window.openModal = (di, idx) => {
  const day = D.days[di], s = day.slots[idx], opts = startOpts(wk, di, s);
  if (!opts.length) return;
  const g = grid(s), segs = segments(wk, di, s), cp = cap(s.n);
  const a0 = opts.find(a => freeMin(segs, a, defEnd(g, a), cp) > 0) || opts[0];
  active = { di, idx, w: wk, date: ymd(dateOf(wk, di)), slot: s, g, dm: dMin(s) };
  const dt = dateOf(wk, di);
  $('#modalSub').textContent = `${day.name} ${dt.getDate()} ${MESI[dt.getMonth()]} · fascia ${fmt(s.s)} – ${fmt(s.e)}`;
  mDa.innerHTML = optsHtml(opts, a0);
  fillEnd(defEnd(g, a0));
  upd();
  $('#bookingModal').classList.add('open');
 };
 window.closeModal = () => {
  $('#bookingModal').classList.remove('open');
  $('#bookingForm').reset();
  active = null;
 };
 $('#bookingModal').onclick = e => { if (e.target.id === 'bookingModal') closeModal(); };

 $('#bookingForm').onsubmit = async e => {
  e.preventDefault();
  if (!active) return;
  const a = +mDa.value, b = +mA.value, s = active.slot, cp = cap(s.n);
  if (b - a < active.dm) { toast('Durata minima ' + active.dm + ' minuti'); return; }
  if (cp - peakOf(a, b).peak <= 0) { upd(); return; }
  mBtn.disabled = true; mBtn.textContent = 'Invio...';
  const payload = {
   action: 'book',
   giorno: D.days[active.di].name,
   data: active.date,
   oraInizio: hhmm(a),
   oraFine: hhmm(b),
   nome: $('#mNome').value.trim(),
   cognome: $('#mCognome').value.trim(),
   telefono: $('#mTel').value.trim(),
   capacita: cp
  };
  try {
   const res = await fetch(GOOGLE_SHEETS_URL, { method: 'POST', body: JSON.stringify(payload) });
   const data = await res.json();
   if (data.status === 'SUCCESS') {
    BOOK.push({ data: payload.data, oraInizio: payload.oraInizio, oraFine: payload.oraFine });
    toast('✅ Prenotazione confermata!');
    closeModal();
    await fetchBookings();
    render();
   } else {
    toast('❌ ' + (data.message || 'Prenotazione non riuscita'));
    await fetchBookings();
    render();
   }
  } catch (err) {
   toast('❌ Errore durante l\'invio. Riprova.');
  } finally {
   mBtn.textContent = 'Conferma';
   mBtn.disabled = false;
   if (active) upd();
  }
 };

 // ---------- pagina ----------
 function render() {
  const ti = todayIdx(), nm = nowMin(), cd = D.days[ti];
  if (sel === null) sel = ti;
  const unlocked = ti >= PROSSIMA_SETTIMANA_DAL_GIORNO;
  if (wk === 1 && !unlocked) { wk = 0; sel = ti; }

  let nowHtml;
  const cur = slotAt(ti, nm);
  if (cur) {
   const sg = segments(0, ti, cur).find(x => x.s <= nm && nm < x.e);
   const fl = freeLanes(cur.n, sg ? sg.c : 0);
   const nx = cd.slots.find(s => tm(s.s) === tm(cur.e));
   const nl = nx ? slotLanes(0, ti, nx) : 0;
   nowHtml = `<div class="big ${cls(fl)}">${fl}</div><div><div class="t">${cur.n <= 0 ? 'Nuoto libero chiuso ora' : fl > 0 ? lab(fl) + ' disponibili ora' : 'Nessuna corsia libera ora'}</div><div class="s">${cd.name} · fino alle ${fmt(cur.e)}${cur.note ? ' · ' + esc(cur.note) : ''}${nx ? ' · poi ' + (nl > 0 ? lab(nl) : 'chiuso') : ''}</div></div>`;
  } else {
   const nxt = cd.slots.find(s => tm(s.s) > nm);
   nowHtml = `<div class="big c-n">–</div><div><div class="t">Nessun dato per quest'ora</div><div class="s">${cd.name}${nxt ? ' · prossima fascia alle ' + fmt(nxt.s) + ' (' + lab(slotLanes(0, ti, nxt)) + ')' : ' · fascia oraria terminata'}</div></div>`;
  }

  const d = D.days[sel], dt = dateOf(wk, sel), isToday = wk === 0 && sel === ti;
  let sl = '';
  d.slots.forEach((s, idx) => {
   const segs = segments(wk, sel, s);
   const lanes = segs.length ? Math.min(...segs.map(x => freeLanes(s.n, x.c))) : s.n;
   const st = slotState(wk, sel, s);
   const isCur = isToday && tm(s.s) <= nm && nm < tm(s.e);
   const txt = lanes > 0 ? lab(lanes) : (s.n > 0 ? (st.ok ? 'Libero solo in alcuni orari' : (st.dim ? '' : 'Completo')) : '');
   sl += `<div class="slot ${cls(lanes)} ${isCur ? 'cur' : ''} ${st.dim ? 'dim' : ''}">
    <div class="h">${fmt(s.s)} – ${fmt(s.e)}${isCur ? ' <span class="note">ORA</span>' : ''}</div>
    <div class="m"><div class="num">${lanes > 0 ? lanes : '×'}</div>${lanes > 0 ? laneBar(lanes) : ''}<span>${txt}</span>${s.note ? `<span class="note">${esc(s.note)}</span>` : ''}${s.n > 0 && !st.dim ? chipsHtml(s, segs) : ''}</div>
    <div><button class="btn-book" ${st.ok ? `onclick="openModal(${sel},${idx})"` : 'disabled'}>${st.label}</button></div>
   </div>`;
  });

  const vnow = isToday ? d.vasca.find(v => tm(v.s) <= nm && nm < tm(v.e)) : null;
  const vs = d.vasca.length ? d.vasca.map(v => `<span class="chip">${fmt(v.s)} – ${fmt(v.e)}</span>`).join('') : '<span class="info">Chiusa in questo giorno</span>';
  const wkBtn = (w, title, sub, dis) => `<button class="${wk === w ? 'on' : ''}" ${dis ? 'disabled' : ''} onclick="setWeek(${w})"><b>${title}</b><br><small>${sub}</small></button>`;
  const y = window.scrollY;
  $('#app').innerHTML = `
  <header><div><h1><small>Piscina · Corsie disponibili</small>${esc(D.titolo)}</h1><span class="period">📅 ${esc(D.periodo)}</span></div></header>
  <div class="card"><h2>Adesso</h2><div class="now">${nowHtml}</div>
   <div class="legend"><span><i class="c-g"></i>5-6 corsie: tanto posto</span><span><i class="c-y"></i>3-4: posto medio</span><span><i class="c-r"></i>1-2: poco posto</span><span><i class="c-x"></i>chiuso o completo</span></div></div>
  <div class="card"><h2>${d.name} ${dt.getDate()} ${MESI[dt.getMonth()]} – dettaglio</h2>
   <div class="weeks">${wkBtn(0, 'Questa settimana', weekRange(0), false)}${wkBtn(1, 'Prossima settimana', unlocked ? weekRange(1) : 'prenotabile da ' + D.days[PROSSIMA_SETTIMANA_DAL_GIORNO].name.toLowerCase(), !unlocked)}</div>
   <div class="tabs">${D.days.map((x, i) => { const dd = dateOf(wk, i), t = wk === 0 && i === ti; return `<button class="${i == sel ? 'on' : ''} ${t ? 'today' : ''}" onclick="pick(${i})">${x.name}${t ? ' •' : ''}<br><small>${dd.getDate()} ${MS[dd.getMonth()]}</small></button>`; }).join('')}</div>
   ${sl}<div class="info">Scegli tu l'orario: puoi prenotare anche solo mezz'ora o un'ora dentro la fascia (minimo ${DURATA_MIN} minuti). Ogni corsia ospita fino a ${PERSONE_PER_CORSIA} persone.</div>
   <div class="info">Nuoto libero su prenotazione al <b>${esc(D.tel)}</b></div></div>
  <div class="card"><h2>Vaschetta libera interna · ${d.name}</h2>${vs}
   <div class="info">${vnow ? '🟢 Aperta ora · ' : ''}Ingresso consentito a max ${D.maxVasca} persone</div></div>
  <div class="info" style="text-align:center">⚠ ${esc(D.avviso)}</div>`;
  window.scrollTo(0, y);
 }

 async function init() {
  render();
  await fetchBookings();
  render();
 }
 init();
 setInterval(async () => { await fetchBookings(); render(); }, 60000);
})()</script></body></html>
